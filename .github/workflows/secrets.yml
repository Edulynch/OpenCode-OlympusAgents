name: Security / secrets and documentation links

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Secret and link gates / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout (read-only, full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Restore pinned Gitleaks archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/olympus-gitleaks-archives
          key: gitleaks-v8.30.1-${{ runner.os }}-${{ runner.arch }}-sha256-v1

      - name: Synthetic Gitleaks canaries
        env:
          OLYMPUS_GITLEAKS_CACHE_DIR: ${{ runner.temp }}/olympus-gitleaks-archives
        run: python -B -m unittest discover -s tests/security -p 'test_secret_gate.py' -v

      - name: Documentation links and index
        run: python -B scripts/check_docs.py

      - name: Gitleaks (changed history and current non-ignored files)
        env:
          OLYMPUS_GITLEAKS_CACHE_DIR: ${{ runner.temp }}/olympus-gitleaks-archives
        shell: bash
        run: |
          if [[ "$SECRET_SCAN_BASE" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            python -B scripts/secret_gate.py --base "$SECRET_SCAN_BASE"
          else
            python -B scripts/secret_gate.py --all-history
          fi
