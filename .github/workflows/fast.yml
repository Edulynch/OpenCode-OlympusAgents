name: CI / FAST

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: FAST / Windows
    runs-on: windows-2025
    needs:
      - global-cli-windows
      - default-agent-windows
      - permission-guard-windows
    if: ${{ always() }}
    timeout-minutes: 20
    steps:
      - name: Require every Windows lane to succeed
        shell: bash
        env:
          GLOBAL_CLI_RESULT: ${{ needs.global-cli-windows.result }}
          DEFAULT_AGENT_RESULT: ${{ needs.default-agent-windows.result }}
          PERMISSION_GUARD_RESULT: ${{ needs.permission-guard-windows.result }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "$GLOBAL_CLI_RESULT" != success ]]; then
            printf 'Global CLI lane result was %q; expected success.\n' "$GLOBAL_CLI_RESULT" >&2
            failed=1
          fi
          if [[ "$DEFAULT_AGENT_RESULT" != success ]]; then
            printf 'Default Agent lane result was %q; expected success.\n' "$DEFAULT_AGENT_RESULT" >&2
            failed=1
          fi
          if [[ "$PERMISSION_GUARD_RESULT" != success ]]; then
            printf 'Permission guard lane result was %q; expected success.\n' "$PERMISSION_GUARD_RESULT" >&2
            failed=1
          fi
          exit "$failed"

  global-cli-windows:
    name: Global CLI and smoke / Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Maintenance Handoff compares a historical baseline commit.

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Prepare isolated Windows temp directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $approvedTemp = Join-Path $env:TEMP 'opencode'
          New-Item -ItemType Directory -Force -Path $approvedTemp | Out-Null

      - name: "Global CLI: install, update, verify, and uninstall (isolated Windows)"
        shell: pwsh
        env:
          OLYMPUS_TEST_ROOT: ${{ runner.temp }}/opencode
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s tests/harness-core -p test_global_cli.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./tests/global-cli/smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm source checkout unchanged
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'Git status failed' }
          if ($changes.Count -gt 0) {
            $changes | Out-Host
            throw 'FAST modified the source checkout'
          }

  default-agent-windows:
    name: Default Agent and offline checks / Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Maintenance Handoff compares a historical baseline commit.

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Prepare isolated Windows temp directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $approvedTemp = Join-Path $env:TEMP 'opencode'
          New-Item -ItemType Directory -Force -Path $approvedTemp | Out-Null

      - name: Olympus FAST (offline only)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/qualify.ps1 -Profile FAST
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release promotion and publication policy (offline)
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests/release -p 'test_release_workflow.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Authority scope invariants (offline)
        shell: pwsh
        run: |
          # Verify this policy change independently of the older full authority
          # suite so a failure can be attributed to the exact contract being tested.
          python -B -m unittest discover -s tests/authority -p 'test_scope_contract.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Authority grants (offline)
        shell: pwsh
        run: |
          # Confirm native DENY for installed assets and scoped ownership for
          # canonical source, including the older authority-grant scenarios.
          pwsh -NoProfile -File ./tests/authority/qualify.ps1 -QualificationSlice Offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Default Agent (isolated Windows)"
        shell: pwsh
        env:
          OLYMPUS_TEST_ROOT: ${{ runner.temp }}/opencode
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s tests/harness-core -p test_default_agent.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CLI completion (native PowerShell)
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests/harness-core -p test_cli.py -k completion -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer post-install validation (mocked OpenCode; isolated Windows fixtures)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/release/postinstall-runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Worktree activation and provisioning safeguards (isolated Windows fixtures)
        shell: pwsh
        run: |
          # Exercise current local-source worktree provisioning and safety gates in temporary Git fixtures.
          pwsh -NoProfile -File ./tests/worktree-activation/qualify.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm source checkout unchanged
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'Git status failed' }
          if ($changes.Count -gt 0) {
            $changes | Out-Host
            throw 'FAST modified the source checkout'
          }

  permission-guard-windows:
    name: Global OpenCode permission guard / Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Prepare isolated Windows temp directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $approvedTemp = Join-Path $env:TEMP 'opencode'
          New-Item -ItemType Directory -Force -Path $approvedTemp | Out-Null

      - name: Global OpenCode permission guard (isolated Windows fixtures)
        shell: pwsh
        run: |
          # Qualify ASK/DENY precedence and global-only install ownership without
          # touching the runner's actual OpenCode or Codex user configuration.
          pwsh -NoProfile -File ./tests/global-installer/qualify.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm source checkout unchanged
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'Git status failed' }
          if ($changes.Count -gt 0) {
            $changes | Out-Host
            throw 'FAST modified the source checkout'
          }

  slice-a-linux:
    name: Read-only and integrated CLI coverage / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Confirm read-only CLI gate has no TOML Kit dependency
        shell: bash
        run: |
          python -B -c 'import importlib.util; assert importlib.util.find_spec("tomlkit") is None, "Read-only CLI environment unexpectedly contains TOML Kit"'

      - name: Read-only CLI behavior (offline)
        shell: bash
        run: |
          python -B -c 'import sys; assert sys.version_info >= (3, 11)'
          sh -n scripts/olympus
          test -x scripts/olympus
          python -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_a -v
          test -x scripts/olympus

      - name: Integrated CLI behavior (isolated TOML Kit)
        shell: bash
        run: |
          venv="$RUNNER_TEMP/olympus-cli-slice-b"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install -r requirements-cli.txt
          "$venv/bin/python" -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_b -v
          "$venv/bin/python" -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_c -v

      - name: Confirm source checkout unchanged
        shell: bash
        run: |
          # Git supplies the executable bit; detect content and mode drift.
          changes=$(git -c core.filemode=true status --porcelain --untracked-files=all --ignored)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  c2-3-writer-compat:
    name: Project manifest, writer-lock, and CLI safety / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2025
          - platform: Linux
            runner: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Verify actual Python and PowerShell versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          $pythonVersion = & python -c 'import sys; print("{}.{}.{}".format(*sys.version_info[:3])); raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
          if ($LASTEXITCODE -ne 0) { throw 'Project writer-lock qualification requires Python 3.11 or newer.' }
          Write-Output "Writer-lock qualification Python actual: $pythonVersion"

          pwsh --version
          $powerShellVersion = & pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query the installed PowerShell version.' }
          $parsedPowerShellVersion = [version]($powerShellVersion | Select-Object -Last 1)
          if ($parsedPowerShellVersion.Major -lt 7) { throw "Project writer-lock qualification requires PowerShell 7+: $powerShellVersion" }
          Write-Output "Writer-lock qualification PowerShell actual: $powerShellVersion"

          $tempRoot = & python -c 'import tempfile; print(tempfile.gettempdir())'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate the native temporary filesystem.' }
          New-Item -ItemType Directory -Force -Path (Join-Path $tempRoot 'opencode') | Out-Null

      - name: Verify actual Python and POSIX shell versions (no PowerShell dependency)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -B -c 'import sys; assert sys.version_info >= (3, 11)'
          sh -n scripts/olympus
          test -x scripts/olympus

      - name: Project manifest and writer-lock compatibility (native filesystem)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testOutput = @(& python -B -m unittest discover -s tests/harness-core -p test_writer_compat.py -k slice_c -v 2>&1)
          $testExitCode = $LASTEXITCODE
          $testOutput | Out-Host
          if ($testExitCode -ne 0) { exit $testExitCode }
          $transcript = $testOutput -join "`n"
          if ($transcript -notmatch '(?m)^Ran 15 tests in ') {
            throw 'Project manifest and writer-lock qualification did not execute all 15 required tests.'
          }
          if ($transcript -match 'skipped' -and
              ($transcript -notmatch 'test_slice_c2_3_windows_powershell_writer_lock_rejects_symlink_lockfile.*skipped' -or
               $transcript -notmatch '(?m)^OK \(skipped=1\)$')) {
            throw 'Windows may skip only the symlink fixture when host privileges prohibit creating it.'
          }
          if ($transcript -notmatch '(?m)^OK(?: \(skipped=1\))?$') {
            throw 'Project manifest and writer-lock Windows results are incomplete.'
          }

          $previewOutput = @(& python -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_c2_3 -v 2>&1)
          $previewExitCode = $LASTEXITCODE
          $previewOutput | Out-Host
          if ($previewExitCode -ne 0) { exit $previewExitCode }
          $previewTranscript = $previewOutput -join "`n"
          if ($previewTranscript -notmatch '(?m)^Ran 1 test in ' -or
              $previewTranscript -notmatch '(?m)^OK$') {
            throw 'CLI preview and disabled --execute safety regression did not pass.'
          }

      - name: Project manifest and writer-lock compatibility (portable Python; no PowerShell)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if test_output=$(python -B -m unittest discover -s tests/harness-core -p test_writer_compat.py -k portable -v 2>&1); then
            printf '%s\n' "$test_output"
          else
            status=$?
            printf '%s\n' "$test_output"
            exit "$status"
          fi
          grep -Eq '^Ran 6 tests in ' <<<"$test_output"
          grep -qx 'OK' <<<"$test_output"
          if preview_output=$(python -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_c2_3 -v 2>&1); then
            printf '%s\n' "$preview_output"
          else
            status=$?
            printf '%s\n' "$preview_output"
            exit "$status"
          fi
          grep -Eq '^Ran 1 test in ' <<<"$preview_output"
          grep -qx 'OK' <<<"$preview_output"

      - name: Linux global installer backend lifecycle (Python fixtures)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests/harness-core -p test_global_linux.py -v

      - name: Linux installer routing and release coordinator (Python fixtures; no PowerShell)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if test_output=$(python -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_c5 -v 2>&1); then
            printf '%s\n' "$test_output"
          else
            status=$?
            printf '%s\n' "$test_output"
            exit "$status"
          fi
          grep -Eq '^Ran 13 tests in ' <<<"$test_output"
          grep -q 'test_slice_c5_windows_project_uninstall_preserves_unmanaged_and_blocks_drift.*skipped' <<<"$test_output"
          grep -qx 'OK (skipped=1)' <<<"$test_output"

      - name: Linux global CLI package lifecycle (Python fixtures)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests/harness-core -p test_global_cli_linux.py -v

      - name: Linux release transport and launcher gates (Python fixtures)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests/harness-core -p test_linux_release_launcher.py -v
          sh -n scripts/olympus
          sh -n install-olympus.sh
          test -x scripts/olympus

      - name: Windows project doctor (read-only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testOutput = @(& python -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_c4 -v 2>&1)
          $testExitCode = $LASTEXITCODE
          $testOutput | Out-Host
          if ($testExitCode -ne 0) { exit $testExitCode }
          $transcript = $testOutput -join "`n"
          if ($transcript -notmatch '(?m)^Ran 4 tests in ' -or
              $transcript -notmatch '(?m)^OK$') {
            throw 'Windows project doctor checks did not all pass.'
          }

      - name: Windows install, update, and uninstall routing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testOutput = @(& python -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_c5 -v 2>&1)
          $testExitCode = $LASTEXITCODE
          $testOutput | Out-Host
          if ($testExitCode -ne 0) { exit $testExitCode }
          $transcript = $testOutput -join "`n"
          if ($transcript -notmatch '(?m)^Ran 13 tests in ' -or
              $transcript -notmatch '(?m)^OK$') {
            throw 'Windows install, update, and uninstall routing tests did not all pass without skips.'
          }

      - name: Windows global diagnostics and project inventory isolation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Fixtures isolate both global roots; native doctor uses VerifyOnly.
          $testOutput = @(& python -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_c7 -v 2>&1)
          $testExitCode = $LASTEXITCODE
          $testOutput | Out-Host
          if ($testExitCode -ne 0) { exit $testExitCode }
          $transcript = $testOutput -join "`n"
          if ($transcript -notmatch '(?m)^Ran 18 tests in ' -or
              $transcript -notmatch '(?m)^OK$' -or $transcript -match 'skipped') {
            throw 'Windows global diagnostics and project inventory tests must all pass without skips.'
          }

      - name: Confirm source checkout unchanged
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $changes = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Git status failed' }
          if ($changes.Count -gt 0) {
            $changes | Out-Host
            throw 'Project manifest and writer-lock qualification modified the source checkout'
          }

      - name: Confirm source checkout unchanged
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          changes=$(git -c core.filemode=true status --porcelain --untracked-files=all --ignored)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
