name: CI / FAST

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: FAST / Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Maintenance Handoff compares a historical baseline commit.

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Prepare isolated FAST temp directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $approvedTemp = Join-Path $env:TEMP 'opencode'
          New-Item -ItemType Directory -Force -Path $approvedTemp | Out-Null

      - name: Olympus FAST (offline only)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/qualify.ps1 -Profile FAST
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm source checkout unchanged
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'Git status failed' }
          if ($changes.Count -gt 0) {
            $changes | Out-Host
            throw 'FAST modified the source checkout'
          }

  slice-a-linux:
    name: Slice A / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Confirm Slice A has no TOML Kit dependency
        shell: bash
        run: |
          python -B -c 'import importlib.util; assert importlib.util.find_spec("tomlkit") is None, "Slice A environment unexpectedly contains TOML Kit"'

      - name: Slice A (offline read-only CLI)
        shell: bash
        run: |
          python -B -c 'import sys; assert sys.version_info >= (3, 11)'
          sh -n scripts/olympus
          test -x scripts/olympus
          python -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_a -v
          test -x scripts/olympus

      - name: Slice B (integrated, isolated TOML Kit)
        shell: bash
        run: |
          venv="$RUNNER_TEMP/olympus-cli-slice-b"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install -r requirements-cli.txt
          "$venv/bin/python" -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_b -v
          "$venv/bin/python" -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_c -v

      - name: Confirm source checkout unchanged
        shell: bash
        run: |
          # Git supplies the executable bit; detect content and mode drift.
          changes=$(git -c core.filemode=true status --porcelain --untracked-files=all --ignored)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  c2-3-writer-compat:
    name: C2.3 writer compatibility / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2025
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Verify actual Python and PowerShell versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          $pythonVersion = & python -c 'import sys; print("{}.{}.{}".format(*sys.version_info[:3])); raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
          if ($LASTEXITCODE -ne 0) { throw 'C2.3 requires Python 3.11 or newer.' }
          Write-Output "C2.3 Python actual: $pythonVersion"

          pwsh --version
          $powerShellVersion = & pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query the installed PowerShell version.' }
          $parsedPowerShellVersion = [version]($powerShellVersion | Select-Object -Last 1)
          if ($parsedPowerShellVersion.Major -lt 7) { throw "C2.3 requires PowerShell 7+: $powerShellVersion" }
          Write-Output "C2.3 PowerShell actual: $powerShellVersion"

          $tempRoot = & python -c 'import tempfile; print(tempfile.gettempdir())'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate the native temporary filesystem.' }
          New-Item -ItemType Directory -Force -Path (Join-Path $tempRoot 'opencode') | Out-Null

      - name: Run every required C2.3 test on native filesystem
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testOutput = @(& python -B -m unittest discover -s tests/harness-core -p test_writer_compat.py -k slice_c2_3 -v 2>&1)
          $testExitCode = $LASTEXITCODE
          $testOutput | Out-Host
          if ($testExitCode -ne 0) { exit $testExitCode }
          $transcript = $testOutput -join "`n"
          if ($transcript -notmatch '(?m)^Ran 11 tests in ') {
            throw 'C2.3 qualification did not execute all 11 required tests.'
          }
          if ($env:RUNNER_OS -eq 'Windows') {
            if ($transcript -match 'skipped' -and
                ($transcript -notmatch 'test_slice_c2_3_writer_lock_rejects_symlink_lockfile.*skipped' -or
                 $transcript -notmatch '(?m)^OK \(skipped=1\)$')) {
              throw 'Windows may skip only the symlink fixture when host privileges prohibit creating it.'
            }
            if ($transcript -notmatch '(?m)^OK(?: \(skipped=1\))?$') {
              throw 'C2.3 Windows test result is incomplete.'
            }
          } else {
            if ($transcript -match 'skipped' -or $transcript -notmatch '(?m)^OK$') {
              throw 'Linux and macOS must execute every C2.3 test without skips.'
            }
          }

          $previewOutput = @(& python -B -m unittest discover -s tests/harness-core -p test_cli.py -k slice_c2_3 -v 2>&1)
          $previewExitCode = $LASTEXITCODE
          $previewOutput | Out-Host
          if ($previewExitCode -ne 0) { exit $previewExitCode }
          $previewTranscript = $previewOutput -join "`n"
          if ($previewTranscript -notmatch '(?m)^Ran 1 test in ' -or
              $previewTranscript -notmatch '(?m)^OK$') {
            throw 'C2.3 CLI preview and disabled --execute regression did not pass.'
          }

      - name: Confirm source checkout unchanged
        shell: pwsh
        run: |
          $changes = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Git status failed' }
          if ($changes.Count -gt 0) {
            $changes | Out-Host
            throw 'C2.3 qualification modified the source checkout'
          }
